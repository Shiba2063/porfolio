<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Website Title -->
    <title>Shiba Bhatta | Personal Portfolio</title>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Shiba Bhatta - IT Engineering Student, Web Developer, and Tech Enthusiast from Nepal. Explore my skills, projects, academic journey, and experience."
    />
    <meta name="author" content="Shiba Bhatta" />
    <meta
      name="keywords"
      content="Shiba Bhatta, Shiba, IT Engineering Student, Web Developer, Portfolio, Nepal, Programmer, Tech Enthusiast"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#11141b" />

    <!-- Standard Favicons -->
    <link
      rel="icon"
      type="image/x-icon"
      href="%PUBLIC_URL%/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon-32x32.png"
    />

    <!-- Apple Touch Icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/apple-touch-icon.png"
    />

    <!-- Web App Manifest -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- Social Media Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shiba Bhatta | Personal Portfolio" />
    <meta
      property="og:description"
      content="Explore the portfolio, skills, projects, and academic journey of Shiba Bhatta, an IT Engineering Student and Web Developer from Nepal."
    />
    <meta property="og:image" content="%PUBLIC_URL%/logo.png" />
